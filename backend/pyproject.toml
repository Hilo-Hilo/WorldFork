[project]
name = "worldfork-backend"
version = "0.1.0"
description = "Backend-only core spine for the WorldFork recursive simulation platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.14.2",
  "httpx>=0.27.0",
  "SQLAlchemy>=2.0.32",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "dramatiq[redis]>=1.17.0",
  "redis>=5.0.0",
  "reportlab>=4.2.0",
  "langgraph>=0.2.60",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "e2e: marks end-to-end tests that exercise the full ASGI app (deselect with '-m \"not e2e\"')",
  "requires_broker: marks tests that need a running Celery broker (skip cleanly if absent)",
  "slow: marks tests that take >5s (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
