name: Validate Skill

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate WorldFork skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate skill metadata
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const skills = [
            { name: "worldfork", path: "skills/worldfork/SKILL.md" },
            { name: "worldfork-setup", path: "skills/worldfork-setup/SKILL.md" },
          ];

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          for (const expected of skills) {
            if (!fs.existsSync(expected.path)) fail(`${expected.path} is missing`);

            const skill = fs.readFileSync(expected.path, "utf8");
            if (!skill.startsWith(`---\nname: ${expected.name}\n`)) {
              fail(`${expected.path} must keep the skill name as ${expected.name}`);
            }
            if (!/^description: .+/m.test(skill)) {
              fail(`${expected.path} must include a description`);
            }
            if (!/^---\nname: .+\ndescription: .+\n---\n/.test(skill)) {
              fail(`${expected.path} must use only name and description in frontmatter`);
            }
          }
          NODE

      - name: Validate repository discovery
        run: npx --yes skills add . --full-depth --list -y

      - name: Validate local discovery
        run: npx --yes skills add ./skills/worldfork --list -y

      - name: Validate setup skill discovery
        run: npx --yes skills add ./skills/worldfork-setup --list -y
