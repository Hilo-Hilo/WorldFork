name: Validate Skill

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "skills/worldfork/**"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    branches:
      - main
    paths:
      - "skills/worldfork/**"
      - ".github/workflows/validate-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate worldfork skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate skill metadata
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const skillPath = "skills/worldfork/SKILL.md";

          function fail(message) {
            console.error(message);
            process.exit(1);
          }

          if (!fs.existsSync(skillPath)) fail("skills/worldfork/SKILL.md is missing");

          const skill = fs.readFileSync(skillPath, "utf8");
          if (!skill.startsWith("---\nname: worldfork\n")) {
            fail("SKILL.md must keep the skill name as worldfork");
          }
          if (!/^description: .+/m.test(skill)) {
            fail("SKILL.md must include a description");
          }
          NODE

      - name: Validate repository discovery
        run: npx --yes skills add . --full-depth --list -y

      - name: Validate local discovery
        run: npx --yes skills add ./skills/worldfork --list -y
