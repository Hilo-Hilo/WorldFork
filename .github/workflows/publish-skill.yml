name: Publish Skill

on:
  push:
    branches:
      - main
    paths:
      - "skills/worldfork/**"
      - ".github/workflows/publish-skill.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-skill
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @worldfork/skill
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/worldfork

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Show package identity
        run: |
          node --version
          npm --version
          npm pkg get name version

      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
            echo "Using NPM_TOKEN fallback authentication."
          else
            echo "No NPM_TOKEN secret configured; relying on npm trusted publishing via OIDC."
          fi

      - name: Check published version
        id: version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is not published yet."
          fi

      - name: Validate package contents
        if: steps.version.outputs.published != 'true'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public --provenance
